name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          # DEPLOY_SSH_KEY holds the private key base64-encoded (single line) so
          # pasting it into the GitHub secrets UI can't mangle its newlines.
          printf '%s' "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

      - name: Deploy to production server
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" -o StrictHostKeyChecking=no -o ConnectTimeout=15 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -e
            # Shared host: bare `php` on PATH is 8.2, incompatible with composer.lock.
            PHP=/opt/alt/php85/usr/bin/php
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin main
            git reset --hard origin/main
            $PHP /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction
            $PHP artisan storage:link || true
            $PHP artisan migrate --force
            $PHP artisan db:seed --class=ServiceSeeder --force
            $PHP artisan optimize:clear
            $PHP artisan optimize
          '
